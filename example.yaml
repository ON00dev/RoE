authorizer: Aletheia Land Security Team
canonicalization: yaml-safe-dump-sorted
engagement_id: ENG-ALETHEIA-2026-001-ADVANCED

emergency_contact:
  email: security-ops@aletheia.land
  phone: "+55 11 99999-0000"
  kill_switch:
    palavra: "STOP-TESTING"
    canal: "telefone + #pentest-ops"
    resposta_esperada: "≤ 2 min"

in_scope_targets:
  - "https://4words.aletheia.land/"
  - "*.aletheia.land"                       # Expandido para permitir movimentação lateral
  - "cloudflare-workers.aletheia.land"      # Alvo específico para lógica de borda
  - "api.aletheia.land"                   # Backend que alimenta os Workers

scope_exclude:
  - "auth.aletheia.land"                  # Exemplo: manter SSO intacto para evitar lockout geral
  - "billing.aletheia.land"
  - "cloudflare.com"                       # PROIBIDO: Ataques à infraestrutura da Cloudflare
  - "dash.cloudflare.com"                 # PROIBIDO: Tentativas de bypass no painel administrativo CF
boundary_rule: "documentar_e_notificar"  # Se encontrar algo crítico fora do escopo, reporta e aguarda

time_window:
  start: "2026-11-12T00:00:00Z"
  end:   "2026-11-16T23:59:59Z"

rate_limits:
  requests_per_second: 150                # Aumentado para testes de stress/fuzzing
  scan_concurrency: 30
  backoff_on_429: "respeitar Retry-After"

permissions:
  bypass_waf_controls:
    enabled: true
    waf: "Cloudflare"
    techniques: ["Payload encoding", "HTTP Parameter Pollution", "Header manipulation"]
    proibido: ["modificar regras globais de firewall da conta"]

  data_exfiltration_simulation:
    enabled: true
    dados: "Sintéticos ou mascarados"
    volume_max: "50 MB"                   # Aumentado para simular dumps de tabelas
    destino: "servidor do tester (IP documentado)"
    methods: ["DNS tunneling", "Out-of-band (OOB) via interactsh/burp-collab"]

  destructive_testing:
    enabled: true
    ambiente: "staging E produção (com aprovação prévia via Slack)" 
    rollback: "snapshot obrigatório antes de payloads de escrita/deleção"
    risk_level: "High"

  dos_testing:
    enabled: true
    ambiente: "staging"
    volume_max: "5000 req/min"            # Teste de exaustão de Workers (CPU limit)
    duracao_max: "20 min"
    abort: "p99 > 1000ms OU 5xx > 5% por 2 min"

  redteam_advanced_techniques:
    enabled: true
    allowed: 
      - "Worker-to-Worker communication exploitation"
      - "KV Store / Durable Objects manipulation"
      - "SSRF via Cloudflare Workers"
      - "Session hijacking e Token forgery"
      - "Advanced Fuzzing de endpoints ocultos"
    limit: "Não comprometer a disponibilidade do serviço para usuários reais"

  ip_rotation_evasion:
    enabled: true
    objetivo: "Validar eficácia do WAF contra botnets distribuídas"
    limite: "Ilimitado (via proxy rotativo)"

health_degradation_stop:
  p99_ms: 800
  erro_5xx_pct: 5.0
  janela: "5 min"
  acao: "parar host afetado, notificar SRE por telefone"

rollback:
  backup_confirmed: true
  responsavel: "SRE on-call (Aletheia)"
  verification: "health endpoint ok + p99 < 200ms por 5 min"

proibido:
  - "Ataques de negação de serviço contra a infraestrutura global da Cloudflare"
  - "Exfiltração de dados reais de clientes (PII/PCI)"
  - "Instalação de backdoors persistentes em produção sem notificação"
  - "Social Engineering contra funcionários da Cloudflare"

signature: *****************************
signature_algorithm: Ed25519
