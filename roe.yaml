authorizer: Aletheia Land Security Team
boundary_rule: documentar_e_notificar
canonicalization: yaml-safe-dump-sorted
emergency_contact:
  email: security-ops@aletheia.land
  kill_switch:
    canal: 'telefone + #pentest-ops'
    palavra: STOP-TESTING
    resposta_esperada: "\u2264 2 min"
  phone: +55 11 99906-1550
engagement_id: ENG-ALETHEIA-2026-001-ADVANCED
health_degradation_stop:
  acao: parar host afetado, notificar SRE por telefone
  erro_5xx_pct: 5.0
  janela: 5 min
  p99_ms: 800
in_scope_targets:
- https://4words.aletheia.land/
- '*.aletheia.land'
- cloudflare-workers.aletheia.land
- api.aletheia.land
permissions:
  bypass_waf_controls:
    enabled: true
    proibido:
    - modificar regras globais de firewall da conta
    techniques:
    - Payload encoding
    - HTTP Parameter Pollution
    - Header manipulation
    waf: Cloudflare
  data_exfiltration_simulation:
    dados: "Sint\xE9ticos ou mascarados"
    destino: servidor do tester (IP documentado)
    enabled: true
    methods:
    - DNS tunneling
    - Out-of-band (OOB) via interactsh/burp-collab
    volume_max: 50 MB
  destructive_testing:
    ambiente: "staging E produ\xE7\xE3o (com aprova\xE7\xE3o pr\xE9via via Slack)"
    enabled: true
    risk_level: High
    rollback: "snapshot obrigat\xF3rio antes de payloads de escrita/dele\xE7\xE3o"
  dos_testing:
    abort: p99 > 1000ms OU 5xx > 5% por 2 min
    ambiente: staging
    duracao_max: 20 min
    enabled: true
    volume_max: 5000 req/min
  ip_rotation_evasion:
    enabled: true
    limite: Ilimitado (via proxy rotativo)
    objetivo: "Validar efic\xE1cia do WAF contra botnets distribu\xEDdas"
  redteam_advanced_techniques:
    allowed:
    - Worker-to-Worker communication exploitation
    - KV Store / Durable Objects manipulation
    - SSRF via Cloudflare Workers
    - Session hijacking e Token forgery
    - Advanced Fuzzing de endpoints ocultos
    enabled: true
    limit: "N\xE3o comprometer a disponibilidade do servi\xE7o para usu\xE1rios reais"
proibido:
- "Ataques de nega\xE7\xE3o de servi\xE7o contra a infraestrutura global da Cloudflare"
- "Exfiltra\xE7\xE3o de dados reais de clientes (PII/PCI)"
- "Instala\xE7\xE3o de backdoors persistentes em produ\xE7\xE3o sem notifica\xE7\xE3\
  o"
- "Social Engineering contra funcion\xE1rios da Cloudflare"
rate_limits:
  backoff_on_429: respeitar Retry-After
  requests_per_second: 150
  scan_concurrency: 30
rollback:
  backup_confirmed: true
  responsavel: SRE on-call (Aletheia)
  verification: health endpoint ok + p99 < 200ms por 5 min
scope_exclude:
- auth.aletheia.land
- billing.aletheia.land
- cloudflare.com
- dash.cloudflare.com
